<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Meta (Facebook) Business domain verification for boxdiamonds.com -->
    <meta name="facebook-domain-verification" content="nuwphkxdeniom77dget1w54abv72bq" />
    <!-- Tracking: Google Tag Manager (GTM-TS9FR3PF), GA4 via gtag.js
         (G-YF4GE487RS) and the Meta Pixel (1119380757335568).
         GA4 is added directly, not through the GTM container (which has no
         tags configured) — don't also add this GA4 ID inside GTM, or every
         visit is counted twice. Meta: fbq('init') only here; every event,
         including PageView on each route change, is sent from
         src/analytics/metaPixel.ts.

         The Google scripts (GTM + gtag.js, ~300 KB) download only once the
         page has loaded, or on the first tap/scroll/key press if that comes
         sooner: on phones they were downloading alongside the hero image
         and delaying it. The gtag() queue exists immediately, so nothing
         the app sends is lost. The Meta Pixel loads straight away, as
         before (see the note on it below). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // The landing page_view is sent explicitly, with the URL and title as
      // they are NOW: gtag.js arrives later, and its automatic page_view
      // would report whatever page the visitor is on by then. In-app
      // navigations before it arrives are sent the same way (below); after
      // that GA4's own history-change page views take over.
      gtag('config', 'G-YF4GE487RS', { send_page_view: false });
      gtag('event', 'page_view', { page_location: location.href, page_title: document.title });

      // Meta Pixel: stock snippet, loaded straight away as before — NOT
      // deferred. Loaded late, the pixel reports every queued event with
      // whatever page the visitor has moved on to, drops repeated
      // PageViews, and can miss the fbclid of an ad click if the visitor
      // taps away from the landing URL first (that cookie also feeds the
      // server-side Conversions API purchase).
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1119380757335568');

      (function () {
        var started = false;
        var triggers = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
        var opts = { passive: true, capture: true };
        function load(src, onload) {
          var s = document.createElement('script');
          s.async = true;
          s.src = src;
          if (onload) s.onload = onload;
          document.head.appendChild(s);
        }

        // Until gtag.js has loaded, record in-app page changes ourselves.
        var gaReady = false;
        var lastUrl = location.href;
        function onUrlChange() {
          if (gaReady || location.href === lastUrl) return;
          lastUrl = location.href;
          var url = lastUrl;
          // GA4 wasn't listening when this URL change happened, so it's ours
          // to send even if gtag.js arrives in the meantime. The 300 ms wait
          // is only for the title, which the app sets just after the URL.
          setTimeout(function () {
            gtag('event', 'page_view', { page_location: url, page_title: document.title });
          }, 300);
        }
        ['pushState', 'replaceState'].forEach(function (name) {
          var original = history[name];
          history[name] = function () {
            var result = original.apply(this, arguments);
            onUrlChange();
            return result;
          };
        });
        window.addEventListener('popstate', onUrlChange);
        function start() {
          if (started) return;
          started = true;
          triggers.forEach(function (t) { window.removeEventListener(t, start, opts); });
          window.removeEventListener('load', start);
          dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          load('https://www.googletagmanager.com/gtm.js?id=GTM-TS9FR3PF');
          load('https://www.googletagmanager.com/gtag/js?id=G-YF4GE487RS', function () { gaReady = true; });
        }
        triggers.forEach(function (t) { window.addEventListener(t, start, opts); });
        if (document.readyState === 'complete') start();
        else window.addEventListener('load', start);
      })();
    </script>
    <!-- End tracking -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Every banner and product photo (including the LCP image) comes from
         this S3 bucket — open the connection while the HTML is still
         parsing instead of when the first <img> is reached. No crossorigin:
         plain <img> requests don't use CORS, so they'd skip a CORS-mode
         connection. -->
    <link rel="preconnect" href="https://boxgold.s3.ap-south-1.amazonaws.com" />
    <!-- Loaded non-render-blocking (media="print" until it arrives, then
         switched to all) — with display=swap the fallback font paints first
         anyway, so blocking first paint on this request bought nothing. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Real <link> to the same stylesheet entry-client.tsx also `import`s —
         a JS import alone means Vite dev-mode only injects the CSS once the
         client script has loaded and run, so SSR'd HTML paints fully-formed
         and unstyled for a beat first (FOUC). A direct <link> is fetched and
         applied by the browser immediately, before any JS runs, in both dev
         and prod. -->
    <link rel="stylesheet" href="/src/index.css" />
    <!--ssr-head-->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TS9FR3PF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=1119380757335568&ev=PageView&noscript=1" /></noscript>
    <div id="root"><!--ssr-outlet--></div>
    <script>window.__REACT_QUERY_STATE__ = /*ssr-state*/undefined;</script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
