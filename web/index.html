<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Real <link> to the same stylesheet entry-client.tsx also `import`s —
         a JS import alone means Vite dev-mode only injects the CSS once the
         client script has loaded and run, so SSR'd HTML paints fully-formed
         and unstyled for a beat first (FOUC). A direct <link> is fetched and
         applied by the browser immediately, before any JS runs, in both dev
         and prod. -->
    <link rel="stylesheet" href="/src/index.css" />
    <!--ssr-head-->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script>window.__REACT_QUERY_STATE__ = /*ssr-state*/undefined;</script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
